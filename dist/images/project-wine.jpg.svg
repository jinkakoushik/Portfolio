<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#3a0708"/>
      <stop offset="45%" stop-color="#16060a"/>
      <stop offset="100%" stop-color="#07070c"/>
    </radialGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4a50"/>
      <stop offset="100%" stop-color="#8a0a10"/>
    </linearGradient>
    <linearGradient id="fadeEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(4,4,8,0.9)"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- faint web in the corner -->
  <g stroke="rgba(255,255,255,0.10)" fill="none" stroke-width="1.4">
    <path d="M0 0 L340 150 M0 0 L300 240 M0 0 L230 330 M0 0 L150 400 M0 0 L60 460"/>
    <path d="M60 42 Q190 66 292 156 M52 92 Q180 120 268 226 M40 148 Q150 190 214 300 M20 210 Q100 260 130 380 M8 280 Q40 340 40 452"/>
  </g>
  <g stroke="rgba(230,36,41,0.35)" fill="none" stroke-width="1.6">
    <path d="M1280 720 L1010 590 M1280 720 L1040 500 M1280 720 L1120 430 M1280 720 L1230 400"/>
    <path d="M1226 672 Q1110 596 1022 500 M1238 626 Q1130 560 1044 470 M1252 578 Q1160 530 1090 448"/>
  </g>

  <!-- wine glass silhouette -->
  <g>
    <path d="M560 130 h160 v96 c0 78 -36 122 -80 122 s-80 -44 -80 -122 z" fill="rgba(10,10,14,0.65)" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
    <path d="M572 176 h136 v50 c0 64 -32 96 -68 96 s-68 -32 -68 -96 z" fill="url(#wine)" opacity="0.92"/>
    <rect x="632" y="348" width="16" height="150" fill="rgba(255,255,255,0.28)"/>
    <ellipse cx="640" cy="506" rx="86" ry="18" fill="rgba(10,10,14,0.65)" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
    <ellipse cx="640" cy="506" rx="86" ry="18" fill="none" stroke="rgba(230,36,41,0.5)" stroke-width="1.5"/>
    <!-- shine -->
    <path d="M586 150 q-10 60 6 110" stroke="rgba(255,255,255,0.45)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- floating grape/orb accents -->
  <circle cx="330" cy="250" r="10" fill="rgba(230,36,41,0.8)"/>
  <circle cx="920" cy="180" r="7" fill="rgba(255,255,255,0.5)"/>
  <circle cx="1000" cy="330" r="9" fill="rgba(230,36,41,0.7)"/>
  <circle cx="270" cy="420" r="6" fill="rgba(255,255,255,0.4)"/>

  <rect y="470" width="1280" height="250" fill="url(#fadeEdge)"/>
  <text x="64" y="640" font-family="Arial Black, Arial, sans-serif" font-size="64" letter-spacing="6" fill="rgba(255,255,255,0.16)">WINE EXPLORER</text>
</svg>
